<!DOCTYPE html>
<html>
<head>
    <title>
        DOM Exercises
    </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Fruits</h1>

    <ul id="fruitList"></ul>


    <h1>Order Form</h1>

    <form id="orderForm">

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your name" required>

        <label for="age">Age</label>
        <input type="number" id="age" min="1" max="120" placeholder="Enter your age" required>

        <label for="gender">Gender</label>
        <select id="gender" required>
            <option value="">Choose your gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label for="orderType">Order type</label>
        <select id="orderType" required>
            <option value="">Choose your order</option>
            <option value="Coffee">Coffee</option>
            <option value="Tea">Tea</option>
            <option value="Chocolate">Chocolate</option>
            <option value="Juice">Juice</option>
            <option value="Water">Water</option>
        </select>

        <p>Do you like your drink cold or hot ?</p>

        <div class="radios">
            <label><input type="radio" name="temp" value="cold" checked> Cold</label>
            <label><input type="radio" name="temp" value="hot"> Hot</label>
        </div>

        <button type="submit">Send Order</button>

    </form>

    <div id="orderResult"></div>


    <script src="script.js"></script>
</body>
</html>
